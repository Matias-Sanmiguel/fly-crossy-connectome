[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-crossy"
version = "0.1.0"
description = "Deterministic training environment for Fly Crossy Connectome"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
