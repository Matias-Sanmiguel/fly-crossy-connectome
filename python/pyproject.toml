[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-crossy"
version = "0.1.0"
description = "Deterministic training environment for Fly Crossy Connectome"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "flygym==2.1.0",
  "mujoco==3.9.0",
  "numpy>=2.0",
  "pydantic>=2.11",
  "torch>=2.12",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
